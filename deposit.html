<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4 text-center">Depositar</h2>
          
          <div id="depositAlert"></div>

          <form id="depositForm">
            <div class="mb-4">
              <label for="depositAmount" class="form-label">Monto a depositar:</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="depositAmount" placeholder="0" min="1" required>
              </div>
            </div>
            
            <div class="d-grid gap-2 mb-3">
              <button type="submit" class="btn btn-primary" id="btnDeposit">Realizar depósito</button>
            </div>
          </form>
          
          <div class="text-center">
            <a href="menu.html" class="btn btn-secondary w-100">Volver al Menú Principal</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('depositForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const amount = parseInt(document.getElementById('depositAmount').value);
      if (isNaN(amount) || amount <= 0) return;

      // Obtener saldo previo e incrementar
      let currentBalance = parseInt(localStorage.getItem('walletBalance') || '60000');
      let newBalance = currentBalance + amount;
      localStorage.setItem('walletBalance', newBalance.toString());

      // Guardar el movimiento en el historial
      let transactions = JSON.parse(localStorage.getItem('walletTransactions') || '[]');
      transactions.unshift({ description: 'Depósito realizado', amount: `+$${amount}` });
      localStorage.setItem('walletTransactions', JSON.stringify(transactions));

      // Mostrar éxito y redirigir
      document.getElementById('depositAlert').innerHTML = `<div class="alert alert-success">Depósito exitoso. Saldo actualizado.</div>`;
      setTimeout(() => {
        window.location.href = "menu.html";
      }, 1500);
    });
  </script>
</body>
</html>
