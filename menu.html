<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Menú Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm p-4 text-center">
          <h2 class="mb-4">Menú Principal</h2>
          
          <div id="redirectMessage" class="alert alert-info d-none mb-3"></div>

          <div class="bg-light p-3 rounded mb-4">
            <p class="text-muted mb-1">Saldo actual de la cuenta</p>
            <h3 class="text-success fw-bold" id="displayBalance">$0</h3>
          </div>

          <div class="d-grid gap-3">
            <button class="btn btn-primary btn-lg navigation-btn" data-target="deposit.html" data-name="depositar">Depositar</button>
            <button class="btn btn-primary btn-lg navigation-btn" data-target="sendmoney.html" data-name="enviar dinero">Enviar Dinero</button>
            <button class="btn btn-primary btn-lg navigation-btn" data-target="transactions.html" data-name="últimos movimientos">Últimos Movimientos</button>
            <hr>
            <a href="login.html" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Recuperar y mostrar el saldo dinámico
    const currentBalance = localStorage.getItem('walletBalance') || '60000';
    document.getElementById('displayBalance').innerText = `$${parseInt(currentBalance).toLocaleString('es-CL')}`;

    // Captura de eventos de los botones de navegación para mostrar la leyenda obligatoria
    document.querySelectorAll('.navigation-btn').forEach(button => {
      button.addEventListener('click', function() {
        const targetPage = this.getAttribute('data-target');
        const pageName = this.getAttribute('data-name');
        const msgDiv = document.getElementById('redirectMessage');
        
        msgDiv.innerText = `Redirigiendo a ${pageName}...`;
        msgDiv.classList.remove('d-none');

        setTimeout(() => {
          window.location.href = targetPage;
        }, 1200);
      });
    });
  </script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="script.js"></script>
</body>
</html>
