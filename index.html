<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm p-4">
          <h2 class="text-center mb-4">Inicio de sesión</h2>
          
          <div id="alertContainer"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input type="email" class="form-control" id="email" placeholder="user@wallet.com" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña:</label>
              <input type="password" class="form-control" id="password" placeholder="••••••" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" id="loginBtn">Iniciar sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inicializar el saldo predeterminado si no existe todavía en el navegador
    if (localStorage.getItem('walletBalance') === null) {
      localStorage.setItem('walletBalance', '60000');
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertContainer = document.getElementById('alertContainer');

      // Validación simple de credenciales ficticias
      if (email === "user@wallet.com" && password === "123456") {
        alertContainer.innerHTML = `<div class="alert alert-success">¡Ingreso exitoso! Redirigiendo...</div>`;
        setTimeout(() => {
          window.location.href = "menu.html";
        }, 1500);
      } else {
        alertContainer.innerHTML = `<div class="alert alert-danger">Credenciales incorrectas. Intente de nuevo.</div>`;
      }
    });
  </script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="wallet.js"></script>
</body>
</html>
