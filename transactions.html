<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Últimos Movimientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 30px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4 text-center">Últimos Movimientos</h2>
          
          <ul class="list-group mb-4" id="transactionsContainer">
            </ul>
          
          <div class="text-center">
            <a href="menu.html" class="btn btn-secondary w-100">Volver al Menú Principal</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Movimientos por defecto solicitados por la consigna original
    const defaultTransactions = [
      { description: "Compra en línea", amount: "-$50.00" },
      { description: "Depósito", amount: "+$100.00" },
      { description: "Transferencia recibida", amount: "+$75.00" },
      { description: "Compra en línea", amount: "-$5,550.00" },
      { description: "Depósito misma cuenta", amount: "+$10,500.00" },
      { description: "Transferencia recibida", amount: "+$7,575.00" }
    ];

    // Obtener transacciones dinámicas hechas en la sesión o usar las por defecto
    let customTransactions = JSON.parse(localStorage.getItem('walletTransactions') || '[]');
    
    // Unir ambas listas mostrando las nuevas primero
    const allTransactions = [...customTransactions, ...defaultTransactions];
    
    const container = document.getElementById('transactionsContainer');
    
    allTransactions.forEach(t => {
      const li = document.createElement('li');
      li.className = "list-group-item d-flex justify-content-between align-items-center";
      
      // Condición para pintar de verde (ingresos) o rojo (egresos)
      const isNegative = t.amount.includes('-');
      const badgeClass = isNegative ? 'bg-danger' : 'bg-success';

      li.innerHTML = `
        ${t.description}
        <span class="badge ${badgeClass} rounded-pill">${t.amount}</span>
      `;
      container.appendChild(li);
    });
  </script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="script.js"></script>
</body>
</html>
